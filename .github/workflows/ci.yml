name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11.13.0

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
